<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light"><meta name="google" content="notranslate"><title>家庭相册 · 照片管理</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;color:#172b28;background:#f2f5f3;font-synthesis:none;--green:#126b54;--line:#dce5df}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button,a,input,select{-webkit-tap-highlight-color:transparent}button{cursor:pointer;min-height:46px;border:1px solid var(--line);border-radius:12px;padding:10px 16px;background:white;color:#172b28;font-weight:600}button:disabled{opacity:.45;cursor:default}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #79bca5;outline-offset:3px}a{color:var(--green)}.primary{background:var(--green);border-color:var(--green);color:white}.danger{color:#fff;background:#b33f39;border-color:#b33f39}.muted{color:#62756d;font-size:13px;line-height:1.6}header{max-width:900px;margin:auto;padding:28px 20px 16px;display:flex;justify-content:space-between;align-items:center}h1{font-size:25px;letter-spacing:-.6px;margin:0 0 5px}header p{margin:0}.view{font-size:14px;text-decoration:none;padding:12px;border:1px solid var(--line);border-radius:12px;background:white;white-space:nowrap}main{max-width:900px;margin:auto;padding:0 16px calc(120px + env(safe-area-inset-bottom))}.card{background:white;border:1px solid var(--line);border-radius:20px;padding:20px;margin-bottom:16px}h2{font-size:19px;margin:0}p{line-height:1.6}.title-row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}.step{font-size:12px;color:var(--green);background:#eaf4ed;padding:5px 9px;border-radius:20px}.pick{width:100%;min-height:88px;border:1px dashed #84ae9b;background:#f3f9f5;color:var(--green);font-size:17px}.pick span{display:block;font-size:12px;color:#637e70;margin-top:6px;font-weight:400}.check{display:flex;gap:9px;align-items:center;margin:16px 0;font-size:15px;min-height:32px}.check input{accent-color:var(--green);width:21px;height:21px;margin:0}.upload-actions{display:flex;gap:10px;align-items:center}.upload-actions .primary{flex:1}.files{display:flex;gap:8px;overflow:auto;margin-top:12px}.file-chip{flex:none;max-width:180px;padding:8px 10px;border-radius:8px;background:#f0f4f1;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.progress{margin-top:14px}.progress progress{width:100%;height:10px;accent-color:var(--green)}.notice{padding:13px 14px;border-radius:12px;margin-top:14px;font-size:14px;line-height:1.65;background:#e9f5ec;color:#205d3c;white-space:pre-line;overflow-wrap:anywhere}.notice.error{background:#fff0eb;color:#993e2c}.settings{padding:0;overflow:hidden}summary{padding:18px 20px;cursor:pointer;min-height:56px;font-weight:600}summary .muted{font-weight:400;margin-left:7px}.settings form{padding:0 20px 20px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}.field{font-size:14px;display:grid;gap:7px}.field input,.field select{width:100%;height:46px;border:1px solid #c8d7ce;border-radius:10px;padding:8px 10px;background:white;color:#172b28}.field small{font-size:11px;color:#62756d}#library{scroll-margin-top:16px}.library-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:26px 2px 14px}.library-head p{margin:4px 0 0}.tools{display:grid;grid-template-columns:1fr 108px;gap:8px;margin-bottom:12px}.tools input,.tools select{width:100%;min-width:0;min-height:46px;border:1px solid #c8d7ce;border-radius:12px;background:white;padding:10px;font-size:14px;color:#172b28}.selection-tools{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}.selection-tools button{font-size:13px;min-height:44px;padding:8px 12px}.selection-tools span{font-size:12px;color:#62756d}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.photo-card{position:relative;border-radius:14px;border:2px solid transparent;background:white;overflow:hidden;min-width:0}.photo-card.selected{border-color:var(--green)}.preview{position:relative;display:block;border:0;padding:0;border-radius:0;min-height:0;width:100%;aspect-ratio:1;background:#e3eae5;overflow:hidden}.preview img{display:block;width:100%;height:100%;object-fit:cover}.preview .broken{position:absolute;inset:0;display:grid;place-items:center;color:#61756a;font-size:12px}.select-photo{position:absolute;top:5px;left:5px;width:44px;height:44px;display:grid;place-items:center;border-radius:12px;background:#ffffffde;z-index:1;cursor:pointer}.select-photo input{width:23px;height:23px;accent-color:var(--green);margin:0;cursor:pointer}.photo-info{padding:9px 8px 10px}.photo-name{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:4px}.photo-meta{font-size:10px;color:#63786d}.empty{text-align:center;padding:40px 15px;border:1px dashed #bdcec3;border-radius:16px;color:#62756d;line-height:1.8}.pager{display:flex;justify-content:center;align-items:center;gap:12px;margin:20px 0}.pager span{font-size:13px}.pager button{font-size:13px}.batch{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom));z-index:5}.batch-inner{max-width:868px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:10px}.batch-left{display:grid;gap:3px}.batch strong{font-size:15px}.batch small{font-size:11px;color:#63786d}.batch-buttons{display:flex;gap:8px}.batch-buttons button{font-size:13px;padding:10px 13px}dialog{border:0;border-radius:20px;padding:24px;width:calc(100% - 36px);max-width:400px;box-shadow:0 20px 80px #0004;color:#172b28}dialog::backdrop{background:#101d1bcc}dialog h2{margin-bottom:12px}dialog p{font-size:14px;color:#62756d}dialog .buttons{display:flex;gap:10px;margin-top:22px}dialog .buttons button{flex:1}#viewer{width:100%;max-width:960px;height:100%;max-height:100%;border-radius:0;background:#0e1715;padding:12px;color:white}#viewer img{width:100%;height:calc(100% - 92px);object-fit:contain;display:block}#viewer p{overflow-wrap:anywhere;color:#d8e3dd;font-size:12px;margin:8px 0}#viewer button{background:#ffffff1a;color:white;border-color:#ffffff4a;float:right}#toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);max-width:calc(100% - 32px);padding:12px 18px;background:#193e31;color:white;border-radius:12px;box-shadow:0 6px 25px #0002;z-index:20;font-size:14px;line-height:1.5;text-align:center;pointer-events:none}[hidden]{display:none!important}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}@media(max-width:600px){header{padding:22px 18px 16px}h1{font-size:23px}.card{padding:17px}.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.photo-info{padding:8px 6px}.photo-name{font-size:11px}.settings{padding:0}.fields{gap:12px}.title-row{margin-bottom:14px}.photo-meta{font-size:9px}.select-photo{top:3px;left:3px;width:40px;height:40px}.photo-card{border-radius:12px}.batch-buttons button{padding:10px}.view{font-size:12px;padding:11px}summary .muted{display:block;margin:5px 0 0}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
.screen-card{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:start}.screen-card h2{margin:0 0 6px}.screen-card p{margin:0}.screen-card .screen-hint{margin-top:6px;font-size:12px;max-width:360px}.screen-actions{display:grid;gap:8px;justify-items:end}.screen-toggle{display:flex;align-items:center;gap:10px;padding:8px 10px;border:0;background:#f0f5f1;white-space:nowrap}.switch-track{width:46px;height:28px;border-radius:20px;background:#b7c6be;position:relative;display:block}.switch-track:after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:white;box-shadow:0 1px 3px #0002}.screen-toggle[aria-checked="true"] .switch-track{background:var(--green)}.screen-toggle[aria-checked="true"] .switch-track:after{left:21px}.screen-actions>button:last-child{font-size:12px;padding:8px 10px;min-height:40px}.screen-card>.notice{grid-column:1/-1;margin-top:0}
</style></head><body>
<header><div><h1>家庭相册</h1><p class="muted">把手机里的回忆，放到屏幕上</p></div><a class="view" href="/">查看播放 →</a></header>
<main><section class="card screen-card" aria-labelledby="screen-heading"><div><h2 id="screen-heading">屏幕控制</h2><p id="screen-state" class="muted" role="status" aria-live="polite">正在读取屏幕状态…</p><p class="muted screen-hint">兼容息屏：纯黑画面、最低背光并保持联网，并非屏幕断电。关闭开关或轻触 相框设备 可恢复播放。</p></div><div class="screen-actions"><button id="screen-toggle" class="screen-toggle" type="button" role="switch" aria-checked="false" aria-label="息屏开关" disabled><span>息屏</span><span class="switch-track" aria-hidden="true"></span></button><button id="screen-wake" type="button" hidden>立即亮屏</button></div><div id="screen-status" class="notice" role="status" hidden></div></section><section class="card" aria-labelledby="upload-heading"><div class="title-row"><h2 id="upload-heading">上传照片</h2><span class="step">默认保留原图</span></div>
<form id="upload-form"><input class="sr" type="file" id="files" name="file" multiple accept="image/jpeg,image/png,image/gif"><button class="pick" type="button" id="choose">＋ 选择手机照片<span>可以一次选择多张 · JPG / PNG / GIF</span></button><div id="file-list" class="files" hidden></div><label class="check"><input type="checkbox" id="original" name="original" value="1" checked>原图上传，不压缩</label><div class="upload-actions"><button type="submit" class="primary" id="upload-button" disabled>请先选择照片</button><button type="button" id="clear-files" hidden>清空</button></div><div class="progress" id="progress-wrap" hidden><label id="progress-label" class="muted" for="progress">准备上传…</label><progress id="progress" value="0" max="100"></progress></div><div id="upload-status" class="notice" role="status" aria-live="polite" hidden></div></form></section>
<details class="card settings"><summary>播放设置 <span class="muted">切换速度、照片尺寸等</span></summary><form id="settings-form"><div class="fields"><label class="field">每张停留（秒）<input type="number" inputmode="numeric" name="nextImage" min="3" max="3600" required value="{{ settings.nextImage }}"></label><input type="hidden" name="refreshImages" value="10"><label class="field">压缩后最大宽度<input type="number" inputmode="numeric" name="imageWidth" min="320" max="8192" required value="{{ settings.imageWidth }}"><small>仅关闭原图上传时生效</small></label><label class="field">压缩后最大高度<input type="number" inputmode="numeric" name="imageHeight" min="320" max="8192" required value="{{ settings.imageHeight }}"><small>单位：像素</small></label><input type="hidden" name="rotateImages" value="0"></div><button type="submit" class="primary">保存播放设置</button><div id="settings-status" class="notice" role="status" hidden></div></form></details>
<section id="library" aria-labelledby="library-heading"><div class="library-head"><div><h2 id="library-heading">照片管理 <span id="total" class="muted"></span></h2><p class="muted">点照片预览，勾选左上角可批量删除</p></div><button id="refresh" aria-label="刷新照片列表">刷新</button></div><div class="tools"><label><span class="sr">查找照片文件名</span><input id="search" type="search" placeholder="按文件名查找照片" autocomplete="off"></label><label><span class="sr">排列顺序</span><select id="sort"><option value="new">最新优先</option><option value="old">最早优先</option><option value="name">文件名顺序</option></select></label></div><div class="selection-tools"><button id="select-page">全选本页</button><span id="range">正在读取照片…</span></div><div id="list-status" role="status" class="notice error" hidden></div><div id="grid" class="grid"></div><div id="empty" class="empty" hidden></div><nav class="pager" aria-label="照片分页"><button id="prev">上一页</button><span id="page-label"></span><button id="next">下一页</button></nav></section>
</main><aside class="batch" aria-label="批量操作"><div class="batch-inner"><div class="batch-left"><strong id="selected-count" aria-live="polite">已选 0 张</strong><small>删除后移入本机回收目录</small></div><div class="batch-buttons"><button id="clear-selection" disabled>取消选择</button><button id="delete" class="danger" disabled>删除所选</button></div></div></aside>
<dialog id="confirm-delete"><h2>删除所选照片？</h2><p id="delete-description"></p><div class="buttons"><button id="cancel-delete">取消</button><button id="confirm-delete-button" class="danger">确认删除</button></div></dialog>
<dialog id="viewer"><button id="close-viewer">关闭预览 ✕</button><img id="full-image" alt="照片原图预览"><p id="full-name"></p></dialog><div id="toast" role="status" aria-live="polite" hidden></div>
<script>
'use strict';
const $=id=>document.getElementById(id), size=24, selected=new Set();
let photos=[],page=1,chosen=[],uploading=false,deleting=false,loaded=false,toastTimer;
const apiHeaders={'Accept':'application/json'};

let screenOff=null,screenAvailable=false,screenBusy=false,screenReading=false;
function applyScreen(data){screenAvailable=!!data.available;screenOff=data.off;const labels={off:'兼容息屏中（保持联网）',on:'照片播放中',dim:'屏幕已调暗',unknown:'暂未获取屏幕状态'};$('screen-state').textContent=screenAvailable?(labels[data.state]||labels.unknown):(data.message||'屏幕控制暂不可用');$('screen-toggle').setAttribute('aria-checked',String(screenOff===true));$('screen-toggle').disabled=!screenAvailable||screenBusy;$('screen-wake').hidden=!screenAvailable||screenOff===false;$('screen-wake').disabled=screenBusy;}
async function readScreen(){if(screenReading||screenBusy)return;screenReading=true;try{const response=await fetch('/api/display',{cache:'no-store'});if(!response.ok)throw Error();applyScreen(await response.json());}catch(error){$('screen-state').textContent='无法连接屏幕控制，请检查网络';$('screen-toggle').disabled=true;$('screen-wake').disabled=true;}finally{screenReading=false;}}
async function setScreen(off){if(screenBusy)return;screenBusy=true;$('screen-toggle').disabled=true;$('screen-wake').disabled=true;$('screen-status').hidden=true;$('screen-state').textContent=off?'正在息屏…':'正在亮屏…';try{const response=await fetch('/api/display',{method:'POST',headers:{...apiHeaders,'Content-Type':'application/json'},body:JSON.stringify({off})});const data=await response.json();if(!response.ok)throw Error(data.message||'屏幕控制失败，请重试');applyScreen(data);notice('screen-status',data.message,!data.confirmed);if(data.confirmed)toast(off?'已进入兼容息屏':'已恢复照片和自动亮度');}catch(error){notice('screen-status',error.message==='Failed to fetch'?'网络中断，请稍后重试。':error.message,true);}finally{screenBusy=false;$('screen-toggle').disabled=!screenAvailable;$('screen-wake').disabled=!screenAvailable;readScreen();}}
$('screen-toggle').onclick=()=>setScreen(screenOff!==true);$('screen-wake').onclick=()=>setScreen(false);readScreen();setInterval(()=>{if(!document.hidden)readScreen();},10000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)readScreen();});

function notice(id,text,error=false){const el=$(id);el.textContent=text;el.classList.toggle('error',error);el.hidden=false;}
function toast(text){$('toast').textContent=text;$('toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').hidden=true,4200);}
function filtered(){let list=photos.filter(p=>p.name.toLocaleLowerCase().includes($('search').value.trim().toLocaleLowerCase()));const sort=$('sort').value;return list.sort(sort==='name'?(a,b)=>a.name.localeCompare(b.name,'zh-CN'):sort==='old'?(a,b)=>a.modified-b.modified||a.name.localeCompare(b.name):(a,b)=>b.modified-a.modified||b.name.localeCompare(a.name));}
function updateSelection(){ $('selected-count').textContent=`已选 ${selected.size} 张`;$('delete').disabled=!selected.size||deleting;$('clear-selection').disabled=!selected.size||deleting;document.querySelectorAll('.photo-card').forEach(card=>{const on=selected.has(card.dataset.name);card.classList.toggle('selected',on);card.querySelector('input').checked=on;});const current=filtered().slice((page-1)*size,page*size);$('select-page').textContent=current.length&&current.every(p=>selected.has(p.name))?'取消本页全选':'全选本页';}
function render(){const list=filtered(),pages=Math.max(1,Math.ceil(list.length/size));page=Math.min(page,pages);const current=list.slice((page-1)*size,page*size);$('grid').replaceChildren();for(const item of current){const card=document.createElement('article');card.className='photo-card';card.dataset.name=item.name;const preview=document.createElement('button');preview.className='preview';preview.type='button';preview.setAttribute('aria-label',`预览照片 ${item.name}`);const img=document.createElement('img');img.src='/thumbnail/'+encodeURIComponent(item.name);img.loading='lazy';img.decoding='async';img.alt=item.name;img.width=240;img.height=240;img.onerror=()=>{img.hidden=true;const text=document.createElement('span');text.className='broken';text.textContent='点此查看原图';preview.append(text);};preview.append(img);preview.onclick=()=>openPreview(item);const label=document.createElement('label');label.className='select-photo';const checkbox=document.createElement('input');checkbox.type='checkbox';checkbox.setAttribute('aria-label',`选择照片 ${item.name}`);checkbox.onchange=()=>{checkbox.checked?selected.add(item.name):selected.delete(item.name);updateSelection();};label.append(checkbox);const info=document.createElement('div');info.className='photo-info';const name=document.createElement('div');name.className='photo-name';name.textContent=item.name;name.title=item.name;const meta=document.createElement('div');meta.className='photo-meta';const date=new Date(item.modified);meta.textContent=`${date.getFullYear()}/${date.getMonth()+1}/${date.getDate()} · ${(item.size/1024/1024).toFixed(1)} MB`;info.append(name,meta);card.append(preview,label,info);$('grid').append(card);}
$('total').textContent=`共 ${photos.length} 张`;$('range').textContent=list.length?`显示 ${(page-1)*size+1}–${Math.min(page*size,list.length)} / ${list.length} 张`:'没有匹配的照片';$('empty').hidden=!!list.length;$('empty').textContent=photos.length?'没有找到这张照片，试试其他文件名。':'相册还是空的，先上传几张喜欢的照片吧。';$('prev').disabled=page<=1;$('next').disabled=page>=pages;$('page-label').textContent=`第 ${page} / ${pages} 页`;$('select-page').disabled=!list.length;updateSelection();}
async function loadPhotos(){ $('refresh').disabled=true;try{const response=await fetch('/api/photos',{cache:'no-store'});if(!response.ok)throw Error();const data=await response.json();if(!Array.isArray(data))throw Error();photos=data;const names=new Set(photos.map(p=>p.name));for(const name of selected)if(!names.has(name))selected.delete(name);loaded=true;$('list-status').hidden=true;render();}catch(error){notice('list-status','照片列表加载失败，请检查与 相框设备 的网络连接后点“刷新”。',true);if(!loaded)$('range').textContent='暂时无法读取';}finally{$('refresh').disabled=false;}}
function openPreview(item){$('full-image').src='/image/'+encodeURIComponent(item.name);$('full-name').textContent=item.name;$('viewer').showModal();}
$('close-viewer').onclick=()=>$('viewer').close();$('viewer').addEventListener('close',()=>$('full-image').removeAttribute('src'));
$('search').oninput=()=>{page=1;render();};$('sort').onchange=()=>{page=1;render();};$('refresh').onclick=loadPhotos;
function changePage(delta){page+=delta;render();$('library').scrollIntoView({behavior:'auto',block:'start'});}
$('prev').onclick=()=>changePage(-1);$('next').onclick=()=>changePage(1);$('select-page').onclick=()=>{const current=filtered().slice((page-1)*size,page*size),remove=current.every(p=>selected.has(p.name));current.forEach(p=>remove?selected.delete(p.name):selected.add(p.name));updateSelection();};$('clear-selection').onclick=()=>{selected.clear();updateSelection();};
$('delete').onclick=()=>{$('delete-description').textContent=`将移除 ${selected.size} 张照片，屏幕将不再播放这些照片。文件会保留在 相框设备 的回收目录中。`;$('confirm-delete').showModal();};$('cancel-delete').onclick=()=>$('confirm-delete').close();
$('confirm-delete-button').onclick=async()=>{if(deleting)return;deleting=true;const names=[...selected];$('confirm-delete-button').disabled=true;$('cancel-delete').disabled=true;updateSelection();try{const response=await fetch('/api/delete',{method:'POST',headers:{...apiHeaders,'Content-Type':'application/json'},body:JSON.stringify({filenames:names})});const data=await response.json();if(!response.ok)throw Error(data.message||'删除失败，请稍后重试');data.deleted.forEach(name=>selected.delete(name));$('confirm-delete').close();toast(`已删除 ${data.deleted.length} 张照片${data.failed.length?`，${data.failed.length} 张未删除，请刷新后重试`:'，已移入回收目录'}`);await loadPhotos();}catch(error){$('confirm-delete').close();notice('list-status',error.message==='Failed to fetch'?'网络连接中断，请刷新核对后重试。':error.message,true);}finally{deleting=false;$('confirm-delete-button').disabled=false;$('cancel-delete').disabled=false;updateSelection();}};
function showChosen(){const count=chosen.length;$('file-list').replaceChildren();chosen.slice(0,6).forEach(file=>{const chip=document.createElement('span');chip.className='file-chip';chip.textContent=file.name;$('file-list').append(chip);});if(count>6){const chip=document.createElement('span');chip.className='file-chip';chip.textContent=`还有 ${count-6} 张`;$('file-list').append(chip);}$('file-list').hidden=!count;$('clear-files').hidden=!count;$('upload-button').disabled=!count||uploading;$('upload-button').textContent=count?`上传 ${count} 张照片`:'请先选择照片';}
$('choose').onclick=()=>$('files').click();$('files').onchange=()=>{chosen=Array.from($('files').files);$('upload-status').hidden=true;showChosen();};$('clear-files').onclick=()=>{chosen=[];$('files').value='';showChosen();};
function sendPhoto(file,onProgress){return new Promise((resolve,reject)=>{const xhr=new XMLHttpRequest(),form=new FormData();form.append('file',file);if($('original').checked)form.append('original','1');xhr.open('POST','/upload');xhr.setRequestHeader('Accept','application/json');xhr.timeout=180000;xhr.upload.onprogress=event=>{if(event.lengthComputable)onProgress(event.loaded/event.total);};xhr.onload=()=>{try{const data=JSON.parse(xhr.responseText);if(xhr.status>=200&&xhr.status<300&&data.uploaded.length){resolve(data);}else reject(Error(data.errors?.[0]?.message||'上传失败，请重试'));}catch(error){reject(Error('服务器未返回上传结果，请刷新核对后重试'));}};xhr.onerror=()=>reject(Error('网络中断，请检查连接后重试'));xhr.ontimeout=()=>reject(Error('上传超时，请刷新核对照片后重试'));xhr.send(form);});}
$('upload-form').onsubmit=async event=>{event.preventDefault();if(uploading||!chosen.length)return;uploading=true;const batch=chosen.slice(),failed=[],messages=[];let success=0;$('choose').disabled=true;$('clear-files').disabled=true;$('original').disabled=true;$('upload-button').disabled=true;$('progress-wrap').hidden=false;$('upload-status').hidden=true;for(let i=0;i<batch.length;i++){const file=batch[i];$('upload-button').textContent=`正在上传 ${i+1} / ${batch.length}`;$('progress-label').textContent=`第 ${i+1} / ${batch.length} 张 · ${file.name}`;try{await sendPhoto(file,ratio=>{$('progress').value=(i+ratio)/batch.length*100;if(ratio===1)$('progress-label').textContent=`第 ${i+1} / ${batch.length} 张 · 正在保存到 相框设备…`;});success++;}catch(error){failed.push(file);messages.push(`${file.name}：${error.message}`);}$('progress').value=(i+1)/batch.length*100;}
chosen=failed;$('files').value='';uploading=false;$('choose').disabled=false;$('clear-files').disabled=false;$('original').disabled=false;$('progress-wrap').hidden=true;showChosen();const message=failed.length?`已上传成功 ${success} 张，${failed.length} 张未上传。\n${messages.slice(0,4).join('\n')}${messages.length>4?'\n其余失败照片已保留，可重试。':''}`:`上传成功！${success} 张照片已保存到 相框设备，将自动加入轮播。`;notice('upload-status',message,!!failed.length);toast(failed.length?`已成功 ${success} 张，${failed.length} 张需要重试`:`上传成功，共 ${success} 张照片`);if(failed.length)$('upload-button').textContent=`重试 ${failed.length} 张照片`;page=1;await loadPhotos();};
$('settings-form').onsubmit=async event=>{event.preventDefault();const button=event.currentTarget.querySelector('button');button.disabled=true;try{const response=await fetch('/upload',{method:'POST',headers:apiHeaders,body:new FormData(event.currentTarget)});const data=await response.json();if(!response.ok)throw Error(data.message);notice('settings-status','播放设置已保存，屏幕会自动应用。');toast('播放设置已保存');}catch(error){notice('settings-status',error.message==='Failed to fetch'?'网络连接失败，请重试。':error.message,true);}finally{button.disabled=false;}};
window.addEventListener('beforeunload',event=>{if(uploading){event.preventDefault();event.returnValue='照片正在上传';}});
loadPhotos();
</script></body></html>
